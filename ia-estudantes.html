<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IA para Estudantes | Jus 9 Tecnologia Jurídica</title>

  <style>
    body {
      font-family: system-ui, Arial, sans-serif;
      margin: 0;
      background: #f7f7fb;
      color: #141414;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 18px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,.08);
    }

    textarea {
      width: 100%;
      min-height: 130px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font: inherit;
      box-sizing: border-box;
    }

    button {
      margin-top: 12px;
      padding: 12px 18px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
    }

    .notice {
      font-size: 14px;
      opacity: .8;
    }

    .markdown-body {
      white-space: normal;
      background: #f1f1f5;
      padding: 16px;
      border-radius: 12px;
      line-height: 1.7;
      font-size: 1.05rem;
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3 {
      margin-top: 1.2rem;
      margin-bottom: 0.7rem;
      font-weight: 700;
    }

    .markdown-body p {
      margin-bottom: 0.9rem;
    }

    .markdown-body ul,
    .markdown-body ol {
      margin-left: 1.5rem;
      margin-bottom: 1rem;
    }

    .markdown-body li {
      margin-bottom: 0.4rem;
    }

    .markdown-body strong {
      font-weight: 700;
    }

    .markdown-body code {
      padding: 0.15rem 0.35rem;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.08);
    }

    .markdown-body pre {
      white-space: pre-wrap;
      overflow-x: auto;
      background: #e6e6ee;
      padding: 12px;
      border-radius: 10px;
    }
  </style>
</head>

<body>
<main>
  <div class="card">
    <h1>IA para Estudantes</h1>

    <p class="notice">
      Ambiente público e educativo da Jus 9 Tecnologia Jurídica.
      Não envie segredo de justiça, documentos sigilosos ou dados pessoais sensíveis.
      A Charlie Echo não substitui advogado, professor ou orientação profissional.
    </p>

    <textarea id="message">Explique de forma simples o que é um DAJ — Dossiê Administrativo Jurídico.</textarea>

    <button id="askButton" type="button">Perguntar</button>

    <h2>Resposta</h2>

    <div id="answer" class="markdown-body">Aguardando pergunta...</div>
  </div>
</main>

<script type="module">
  import { marked } from "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js";
  import DOMPurify from "https://cdn.jsdelivr.net/npm/dompurify@3.1.6/+esm";

  marked.setOptions({
    gfm: true,
    breaks: true
  });

  const answer = document.getElementById("answer");
  const message = document.getElementById("message");
  const askButton = document.getElementById("askButton");

  function renderMarkdown(markdownText) {
    const textoSeguro = String(markdownText || "");
    const htmlConvertido = marked.parse(textoSeguro);
    const htmlLimpo = DOMPurify.sanitize(htmlConvertido);

    answer.innerHTML = htmlLimpo;
  }

  async function askAI() {
    answer.textContent = "Consultando a IA da Jus 9...";
    askButton.disabled = true;

    try {
      const res = await fetch("/api/ia", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: message.value
        })
      });

      const data = await res.json();

      if (!data.ok) {
        answer.textContent = data.error || "Não foi possível consultar a Charlie Echo agora.";
        return;
      }

      renderMarkdown(data.answer || JSON.stringify(data, null, 2));
    } catch (err) {
      answer.textContent = "Não foi possível consultar a Charlie Echo agora. Tente novamente mais tarde.";
    } finally {
      askButton.disabled = false;
    }
  }

  askButton.addEventListener("click", askAI);
</script>
</body>
</html>
