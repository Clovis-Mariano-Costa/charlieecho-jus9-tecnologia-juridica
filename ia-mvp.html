<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IA Jurídica MVP | Jus 9 Tecnologia Jurídica</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 0; background: #10131a; color: #f5f5f5; }
    main { max-width: 920px; margin: 0 auto; padding: 32px 18px; }
    .card { background: #181d29; border-radius: 18px; padding: 24px; box-shadow: 0 12px 32px rgba(0,0,0,.28); }
    textarea { width: 100%; min-height: 160px; padding: 14px; border-radius: 12px; border: 1px solid #333b4f; background: #0f1320; color: #fff; font: inherit; box-sizing: border-box; }
    button { margin-top: 12px; padding: 12px 18px; border: 0; border-radius: 999px; cursor: pointer; font-weight: 700; }
    pre { white-space: pre-wrap; background: #0f1320; padding: 16px; border-radius: 12px; }
    .notice { font-size: 14px; opacity: .85; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>IA Jurídica do MVP</h1>
    <p class="notice">Ambiente interno/profissional. Uso sujeito a revisão humana, sigilo, LGPD, auditoria e responsabilidade do advogado líder.</p>
    <textarea id="message">Crie um checklist inicial para abertura de DAJ de um novo cliente, considerando documentos, dados básicos, anexos, foto, auditoria e responsabilidade do advogado líder.</textarea>
    <button onclick="askAI()">Consultar IA Jurídica</button>
    <h2>Resposta</h2>
    <pre id="answer">Aguardando consulta...</pre>
  </div>
</main>
<script>
async function askAI() {
  const answer = document.getElementById('answer');
  answer.textContent = 'Consultando a IA jurídica do MVP...';
  try {
    const res = await fetch('/api/ia', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'mvp', message: document.getElementById('message').value })
    });
    const data = await res.json();
    answer.textContent = data.answer || JSON.stringify(data, null, 2);
  } catch (err) {
    answer.textContent = 'Erro: ' + err.message;
  }
}
</script>
</body>
</html>
