<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" role="img" aria-labelledby="title desc">
  <title id="title">Simbolo Jus 9 Tecnologia Juridica</title>
  <desc id="desc">Simbolo vetorial com estrela de exatamente nove pontas, flecha unica para cima, balanca da justica, numero 9 e numero 9 espelhado.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#95600f"/>
      <stop offset=".38" stop-color="#ffe6a0"/>
      <stop offset=".68" stop-color="#d39a2b"/>
      <stop offset="1" stop-color="#87500b"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" x2="1">
      <stop offset="0" stop-color="#9aa7b8"/>
      <stop offset=".45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c4d4"/>
    </linearGradient>
    <radialGradient id="navy" cx=".5" cy=".42" r=".7">
      <stop offset="0" stop-color="#102a48"/>
      <stop offset="1" stop-color="#030a14"/>
    </radialGradient>
  </defs>
  <circle cx="220" cy="170" r="164" fill="url(#navy)" stroke="#2b5f8f" stroke-width="2"/>
  <circle cx="220" cy="170" r="153" fill="none" stroke="#d8a63d" stroke-width="2" opacity=".72"/>
  <g fill="none" stroke="#3e8bc7" stroke-width="1" opacity=".46">
    <path d="M62 130h44l20-20h34M378 130h-44l-20-20h-34M72 225h52l18-18h30M368 225h-52l-18-18h-30"/>
    <path d="M101 78v28M339 78v28M101 242v24M339 242v24"/>
  </g>
  <!-- Exact nonagram: 9 outer points alternating with 9 inner points. -->
  <path d="M220 18 L229.23 46.63 L254.71 30.63 L243.38 58.5 L273.18 62.62 L246.59 76.69 L266.77 99 L237.36 92.68 L238.47 122.74 L220 99 L201.53 122.74 L202.64 92.68 L173.23 99 L193.41 76.69 L166.82 62.62 L196.62 58.5 L185.29 30.63 L210.77 46.63 Z"
        fill="url(#gold)" stroke="#ffe6a0" stroke-width="2"/>
  <!-- Single upward arrowhead and central axis. -->
  <path d="M220 112 L184 184 L207 178 L207 293 L220 316 L233 293 L233 178 L256 184 Z"
        fill="url(#silver)" stroke="#07111f" stroke-width="4"/>
  <path d="M220 112V313" stroke="#d8a63d" stroke-width="3"/>
  <!-- Scale beam. -->
  <path d="M88 157 C132 120 180 119 220 143 C260 119 308 120 352 157"
        fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
  <path d="M88 157 C132 132 180 131 220 151 C260 131 308 132 352 157"
        fill="none" stroke="#ffe6a0" stroke-width="2" opacity=".8"/>
  <!-- Left 9 and mirrored right 9. -->
  <path d="M176 174 C124 176 111 243 159 257 C199 269 222 232 196 208 C179 193 151 198 150 222 C150 236 166 243 178 233"
        fill="none" stroke="url(#gold)" stroke-width="17" stroke-linecap="round"/>
  <path d="M264 174 C316 176 329 243 281 257 C241 269 218 232 244 208 C261 193 289 198 290 222 C290 236 274 243 262 233"
        fill="none" stroke="url(#gold)" stroke-width="17" stroke-linecap="round"/>
  <circle cx="88" cy="157" r="9" fill="#07111f" stroke="#d8a63d" stroke-width="6"/>
  <circle cx="352" cy="157" r="9" fill="#07111f" stroke="#d8a63d" stroke-width="6"/>
  <g fill="none" stroke="url(#gold)" stroke-width="4">
    <path d="M88 169 L53 238 M88 169 L123 238 M352 169 L317 238 M352 169 L387 238"/>
  </g>
  <path d="M43 238 C56 264 120 264 133 238 Z" fill="url(#gold)" stroke="#ffe6a0" stroke-width="2"/>
  <path d="M307 238 C320 264 384 264 397 238 Z" fill="url(#gold)" stroke="#ffe6a0" stroke-width="2"/>
</svg>
